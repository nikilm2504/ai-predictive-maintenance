
services:
  postgres:
    image: postgres:16
    container_name: predictive_maintenance_db
    environment:
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password
    ports:
      # Host port 5433 avoids conflict with any local PostgreSQL instance on the default 5432 port.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pm_user -d predictive_maintenance" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: predictive_maintenance_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
