spring:
  application:
    name: predictive-maintenance-backend
  mvc:
    problemdetails:
      enabled: true

  # ---------------------------------------------------------------------------
  # DataSource — PostgreSQL
  # Development defaults are intentionally documented here.
  # Override with environment variables (SPRING_DATASOURCE_*) in other environments.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/predictive_maintenance}
    username: ${SPRING_DATASOURCE_USERNAME:pm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pm_password}
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ddl-auto=validate: Hibernate validates entities against the physical schema
  # created by Flyway. It does NOT create or modify tables.
  # See ADR-008.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # ---------------------------------------------------------------------------
  # Flyway
  # Flyway is enabled and manages all schema migrations automatically on boot.
  # Migration scripts are located in: classpath:db/migration/
  # See ADR-008.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: "http://localhost:5173"
        allowed-methods: "GET,OPTIONS"
        allow-credentials: true
  endpoint:
    health:
      show-details: always
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:predictive-maintenance-backend}
  topic: ${MQTT_TOPIC:machines/+/telemetry}

ml:
  service:
    base-url: http://localhost:8000
